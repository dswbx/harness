[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "fs"] }
specta = { version = "=2.0.0-rc.27", features = ["derive", "serde_json"] }
specta-typescript = "0.0.14"
specta-serde = "0.0.14"
uuid = { version = "1", features = ["v4", "v7"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
