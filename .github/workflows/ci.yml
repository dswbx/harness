# Same checks as the Release workflow's Check step, on every PR and push to main, so a release
# never is the first place they fail.
name: CI

on:
   pull_request:
   push:
      branches: [main]

concurrency:
   group: ci-${{ github.ref }}
   cancel-in-progress: true

jobs:
   check:
      runs-on: macos-latest
      steps:
         - uses: actions/checkout@v4

         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.3.13

         - uses: dtolnay/rust-toolchain@stable

         - uses: Swatinem/rust-cache@v2

         - run: bun install --frozen-lockfile

         - name: Check
           run: |
              bun run lint
              bun run typecheck
              bun run test
              cargo test -p harness-core
