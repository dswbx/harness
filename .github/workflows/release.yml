# Stable release, run by hand from main: Actions > Release > Run workflow.
# Tags v{year}.{month}.{n} on the dispatched commit (no version bump commit), builds a universal
# macOS app (ad-hoc signed, not notarized), and publishes it with the updater's latest.json.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - run: bun install --frozen-lockfile

      - name: Check
        run: |
          bun run typecheck
          bun run test
          cargo test -p harness-core

      - name: Compute version
        id: version
        run: bun scripts/release-version.ts

      - name: Release config
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "{\"version\":\"$VERSION\",\"bundle\":{\"createUpdaterArtifacts\":true}}" > "$RUNNER_TEMP/release.conf.json"

      # Draft first, so releases/latest (what the updater reads) only moves once every asset is up.
      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A failed run leaves its draft behind; reuse it.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Harness $TAG" --generate-notes
          id="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ steps.draft.outputs.id }}
          tagName: ${{ steps.version.outputs.tag }}
          tauriScript: bunx tauri
          args: --target universal-apple-darwin --config ${{ runner.temp }}/release.conf.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
