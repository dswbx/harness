[package]
name = "harness-core"
edition.workspace = true
publish = false
version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
parking_lot.workspace = true
specta.workspace = true
specta-typescript.workspace = true
specta-serde.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
globset = "0.4"
sha2 = "0.10"
rmcp = { version = "3.7", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
http = "1"
jsonschema = { version = "0.33", default-features = false }
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "http2", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
agent-client-protocol = { version = "3.5", features = ["process", "unstable_session_fork"] }
base64 = "0.22"
portable-pty = "0.9"
notify = "8"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"

[lints]
workspace = true
