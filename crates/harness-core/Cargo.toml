[package]
name = "harness-core"
edition.workspace = true
publish = false
version.workspace = true

[dependencies]
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
parking_lot.workspace = true
specta.workspace = true
specta-typescript.workspace = true
specta-serde.workspace = true
uuid.workspace = true
anyhow.workspace = true
tracing.workspace = true
globset = "0.4"
sha2 = "0.10"
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
http = "1"
jsonschema = { version = "0.33", default-features = false }
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "http2", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
agent-client-protocol = { workspace = true, features = ["process", "unstable_session_fork"] }
base64.workspace = true
portable-pty = "0.9"
notify = "8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["net"] }

# Not the workspace lints: `proc::run` needs one `unsafe` (`setsid` between fork and exec).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
