# cargo deny check: known vulnerabilities, licenses, duplicate and unknown sources.
[graph]
all-features = false

[advisories]
# Unmaintained crates deep in the Tauri/GTK tree are not ours to replace; vulnerabilities still fail.
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
   "MIT",
   "MIT-0",
   "Apache-2.0",
   "Apache-2.0 WITH LLVM-exception",
   "BSD-2-Clause",
   "BSD-3-Clause",
   "ISC",
   "Zlib",
   "Unicode-3.0",
   "MPL-2.0",
   "CC0-1.0",
   "0BSD",
   "BSL-1.0",
   "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
# Tauri pulls in several major versions of common crates; report them, don't fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# tauri-nspanel (Quick Overlay, ADR 0022) is not on crates.io.
allow-git = ["https://github.com/ahkohd/tauri-nspanel"]
